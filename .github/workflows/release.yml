# Builds Power Scan for Windows and Linux. Pushing a tag such as v1.0.0 also publishes a GitHub Release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Create the GitHub Release, or add missing files to an existing one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="out/windows/release/*.exe out/windows/dist/*.zip out/linux/*.AppImage out/linux/*.deb"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for f in $files; do gh release upload "$GITHUB_REF_NAME" "$f" --repo "$GITHUB_REPOSITORY" || echo "kept existing $(basename "$f")"; done
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "Power Scan $GITHUB_REF_NAME" --generate-notes
          fi
