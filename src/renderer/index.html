<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Scan</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="win" id="win">
  <div class="titlebar" id="titlebar">
    <div class="tb-name"><span class="app-icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M6.6 7.2a7.6 7.6 0 1 0 10.8 0"/></svg></span>Power Scan</div>
    <div class="tb-ctrls">
      <button class="tb-btn" id="btnMin" type="button" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3.5 8.5h9"/></svg></button>
      <button class="tb-btn" id="btnMax" type="button" aria-label="Maximize" title="Maximize"><svg id="icoMax" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="3.5" width="9" height="9" rx="1.2"/></svg></button>
      <button class="tb-btn close" id="btnClose" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Power Scan features" data-tab="scan">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab" id="tabScan" role="tab" type="button" aria-selected="true" aria-controls="panelScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 2.8v5.2c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6.3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>Virus Scan<span class="tab-dot" id="dotScan" hidden></span></button>
    <button class="tab" id="tabSpeed" role="tab" type="button" aria-selected="false" aria-controls="panelSpeed" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5a8 8 0 1 1 15 0"/><path d="M12 14.5l3.6-4.2"/><circle cx="12" cy="14.8" r="1.1"/></svg>Speed Test<span class="tab-dot" id="dotSpeed" hidden></span></button>
    <button class="tab" id="tabDrivers" role="tab" type="button" aria-selected="false" aria-controls="panelDrivers" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></svg>Drivers<span class="tab-dot" id="dotDrivers" hidden></span></button>
  </div>

  <div class="win-body">
    <div class="banner" id="banner" role="alert" hidden></div>

    <section class="tabpanel" id="panelScan" role="tabpanel" aria-labelledby="tabScan">
      <div class="scroll" id="scanScroll">
        <div class="dialcol">
          <div class="statusline"><span class="chip" id="scanChip">Not scanned yet</span><span class="engine" id="scanEngine"></span></div>
          <div class="dial" id="scanDial">
            <svg viewBox="0 0 240 240" id="scanRing" aria-hidden="true"></svg>
            <button class="power" id="scanPower" type="button" aria-label="Start full scan"></button>
          </div>
          <p class="dial-caption" id="scanCaption"></p>
        </div>
        <div class="infocol">
          <div id="scanNotes"></div>
          <div class="feed" id="scanFeed" hidden>
            <div class="phases" id="scanPhases"></div>
            <ul class="log" id="scanLog" aria-hidden="true"></ul>
            <div class="counters">
              <div><span class="k">Checked</span><span class="v" id="cChecked">0</span></div>
              <div id="cThreatsBox"><span class="k">Found</span><span class="v" id="cThreats">0</span></div>
              <div><span class="k">Time</span><span class="v" id="cTime">00:00</span></div>
            </div>
          </div>
          <div class="results" id="scanResults" hidden></div>
          <div class="glance" id="scanGlance"></div>
          <div class="traffic" id="traffic" hidden></div>
        </div>
      </div>
      <div class="listener">
        <button class="switch" id="listenerSwitch" type="button" role="switch" aria-checked="false" aria-labelledby="listenerLabel"></button>
        <div class="l-text"><div class="t" id="listenerLabel">Passive Listener</div><div class="s" id="listenerSub"></div></div>
        <span class="live" id="listenerLive" hidden></span>
      </div>
    </section>

    <section class="tabpanel" id="panelSpeed" role="tabpanel" aria-labelledby="tabSpeed" hidden>
      <div class="scroll" id="speedScroll">
        <div class="dialcol">
          <div class="statusline"><span class="chip" id="speedChip">Not tested yet</span><span class="engine">Server · Cloudflare</span></div>
          <div class="dial" id="speedDial">
            <svg viewBox="0 0 240 240" id="speedRing" aria-hidden="true"></svg>
            <button class="power sm" id="speedPower" type="button" aria-label="Start speed test"></button>
          </div>
          <p class="dial-caption" id="speedCaption"></p>
        </div>
        <div class="infocol">
          <div class="phases four" id="speedPhases" hidden></div>
          <div class="readouts" id="readouts"></div>
          <div class="monitor" id="monitor" hidden>
            <div class="hd"><span><b>Connection</b> · last 30 s</span><span class="lgs"><span class="lg"><i></i>Latency</span><span class="lg"><i class="dr"></i>Drop</span></span></div>
            <svg id="monSvg" height="88" aria-hidden="true"></svg>
          </div>
          <div class="diag" id="diag" hidden></div>
        </div>
      </div>
    </section>

    <section class="tabpanel" id="panelDrivers" role="tabpanel" aria-labelledby="tabDrivers" hidden>
      <div class="scroll" id="drvScroll">
        <div class="dialcol">
          <div class="statusline"><span class="chip" id="drvChip">Not checked yet</span><span class="engine" id="drvEngine"></span></div>
          <div class="dial" id="drvDial">
            <svg viewBox="0 0 240 240" id="drvRing" aria-hidden="true"></svg>
            <button class="power" id="drvPower" type="button" aria-label="Check drivers"></button>
          </div>
          <p class="dial-caption" id="drvCaption"></p>
        </div>
        <div class="infocol">
          <div class="feed" id="drvFeed" hidden>
            <div class="phases cols4" id="drvPhases"></div>
            <ul class="log" id="drvLog" aria-hidden="true"></ul>
            <div class="counters">
              <div><span class="k">Drivers</span><span class="v" id="dChecked">0</span></div>
              <div id="dIssuesBox"><span class="k">Need attention</span><span class="v" id="dIssues">0</span></div>
              <div><span class="k">Time</span><span class="v" id="dTime">00:00</span></div>
            </div>
          </div>
          <div class="results" id="drvResults" hidden></div>
          <div class="glance" id="drvGlance"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>
</div>
</body>
</html>
